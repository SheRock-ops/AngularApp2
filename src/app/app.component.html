<!-- =========================================
     APPLICATION HEADER
========================================= -->

<header class="dashboard-header">

    <div class="header-content">

        <div class="brand">
            <span class="brand-icon">✦</span>
            <span>DAILY <strong>FOCUS</strong></span>
        </div>

        <div class="header-badge">
            YOUR PRODUCTIVITY COMPANION
        </div>

    </div>

</header>


<!-- =========================================
     MAIN DASHBOARD
========================================= -->

<main class="dashboard-main">

    <!-- =========================================
         WELCOME SECTION
    ========================================= -->

    <section class="welcome-section">

        <span class="welcome-label">
            FOCUS. PLAN. ACHIEVE.
        </span>

        <h1>
            Make Today <span>Count.</span>
        </h1>

        <p>
            Organize your priorities, manage your daily tasks,
            and celebrate every accomplishment along the way.
        </p>

    </section>


    <!-- =========================================
         TASK SUMMARY
    ========================================= -->

    <app-task-summary></app-task-summary>


    <!-- =========================================
         TASK MANAGEMENT GRID
    ========================================= -->

    <div class="dashboard-grid">

        <!-- =========================================
             ADD TASK FORM
        ========================================= -->

        <section class="form-column">

            <app-task-form></app-task-form>

        </section>


        <!-- =========================================
             DAILY TASK LIST
        ========================================= -->

        <section class="list-column">

            <app-task-list></app-task-list>

        </section>

    </div>

</main>

     APPLICATION FOOTER
========================================= -->

<footer class="dashboard-footer">

    <p>
        Daily Focus Tracker | Built with Angular
    </p>

    <p>
