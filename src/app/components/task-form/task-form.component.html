
<section class="task-form-card">

    <div class="section-heading">
        <span class="section-label">PLAN YOUR DAY</span>
        <h2>Add a New Task</h2>
        <p>Stay organized and make every day productive.</p>
    </div>

    <form (ngSubmit)="addTask()" #taskForm="ngForm">

        <!-- Task title -->
        <div class="form-group">
            <label for="taskTitle">Task Title</label>

            <input
                type="text"
                id="taskTitle"
                name="title"
                [(ngModel)]="title"
                placeholder="What do you need to accomplish?"
                required
                maxlength="100"
            >
        </div>

        <!-- Task description -->
        <div class="form-group">
            <label for="taskDescription">Description</label>

            <textarea
                id="taskDescription"
                name="description"
                [(ngModel)]="description"
                placeholder="Add more details about your task..."
                rows="4"
            ></textarea>
        </div>

        <!-- Due date -->
        <div class="form-group">
            <label for="taskDueDate">Due Date</label>

            <input
                type="date"
                id="taskDueDate"
                name="dueDate"
                [(ngModel)]="dueDate"
            >
        </div>

        <!-- Task priority -->
        <div class="form-group">
            <label for="taskPriority">Priority</label>

            <select
                id="taskPriority"
                name="priority"
                [(ngModel)]="priority"
            >
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
        </div>

        <!-- Submit button -->
        <button
            type="submit"
            class="add-task-btn"
            [disabled]="taskForm.invalid"
        >
            + Add Task
        </button>

    </form>

</section>
